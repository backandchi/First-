name: Build Android APK (zip'dan)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Repo ildizida Madel-fixed.zip (ichida Madel-main/ papkasi) bor — avval uni ochamiz
      - name: Madel-fixed.zip'ni ochish
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Repo ildizida .zip fayl topilmadi!"
            exit 1
          fi
          echo "Topildi: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted
          # zip ichidagi loyiha papkasini (masalan Madel-main) topib, uni "project" ga ko'chiramiz
          PROJECT_DIR=$(find extracted -maxdepth 1 -mindepth 1 -type d | head -n 1)
          echo "Loyiha papkasi: $PROJECT_DIR"
          mv "$PROJECT_DIR" project

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Keystore'ni tayyorlash (agar Secrets berilgan bo'lsa)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK yig'ish (debug + release)
        working-directory: project
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace --no-configuration-cache

      - name: Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aiko-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Release APK
        uses: actions/upload-artifact@v4
        with:
          name: aiko-release-apk
          path: project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
